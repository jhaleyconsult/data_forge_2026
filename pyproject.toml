[project]
name = "data-forge-2026"
version = "0.1.0"
description = "Discrete-event simulation of hospital bed scheduling from Virginia aggregate data"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb",
    "fastapi>=0.143.0",
    "ipykernel",
    "jupyterlab",
    "marimo>=0.25.1",
    "matplotlib",
    "numpy",
    "ortools",
    "pandas",
    "plotly",
    "pyyaml",
    "scipy",
    "simpy",
    "streamlit",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
