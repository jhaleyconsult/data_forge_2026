occupied_bed_history:
  target_hospital: "VCU Medical Center"
  staffed_beds: 905
  annual_patient_days: 247208
  reference_average_daily_census: 676.818617
  calibration_year: 2024
  # ASSUMPTION: VCU follows Virginia's historical monthly occupancy pattern.
  use_constant_statewide_share: true
  calibrated_statewide_share: 0.055299
  historical_start: "2017-01-01"
  historical_end: "2024-12-01"
  daily_generation:
    seed: 2026
    # ASSUMPTION: Daily census standard deviation is 3% of the monthly mean.
    coefficient_of_variation: 0.03
    # ASSUMPTION: Consecutive daily census deviations follow an AR(1) process.
    persistence: 0.85
    integer_counts: true
    preserve_monthly_patient_days: true
    minimum_occupied_beds: 0
    maximum_occupied_beds: 905

bed_type_estimation:
  # ASSUMPTION: VCU's intensive-care share follows Virginia's monthly share.
  intensive_bed_method: "statewide_intensive_share"
  # ASSUMPTION: the 2022 ICU step-down reflects post-vaccination decline in severe COVID-19 (historical context, not tested).
  icu_2022_level_shift_explanation: "covid_19_vaccination"
  influenza_imputation:
    missing_marker: "***"
    # ASSUMPTION: Suppressed values follow the median for the same calendar month.
    method: "calendar_month_median"
  covid_19_alignment:
    raw_series_start: "2017-01-01"
    outbreak_observation_start: "2020-01-01"
    outbreak_observation_end: "2024-09-01"
    pre_outbreak_months_excluded: 36
    observed_months: 57
    # Pre-2020 zeros indicate unavailable/not-applicable data, not zero-day stays.
    treat_pre_outbreak_zeros_as_missing: true
    unavailable_months:
      - "2024-10-01"
      - "2024-11-01"
      - "2024-12-01"
  excluded_intensive_bounds:
    use_minimum: false
    use_maximum: false
    reason: "The final minimum value is 7 and requires source verification."
  patient_flow:
    annual_discharges: 41852
    derived_average_los_days: 5.906719
    # ASSUMPTION: Aggregate admissions and discharges are balanced in steady state.
    use_steady_state_balance: true
    # ASSUMPTION: Use the user-reported 28% for ED-originating inpatient admissions
    # routed to ICU, not for all ED visits; source and original denominator are unverified.
    ed_originating_inpatient_admissions_to_icu_share: 0.28
  category_occupancy:
    categories:
      - newborn
      - delivery
      - non_elective_via_ed
      - non_elective_other
      - elective
      - covid_19
      - influenza
      - other_viral
    # ASSUMPTION: every non-ICU category admits patients at the same average daily rate.
    method: "equal_admission_rate_proportional_to_los"
    # ICU is a peer section (ward), not a diagnosis subset; non-ICU categories
    # split only the non-ICU remainder so all 9 sections sum to total census.
    icu_is_peer_section: true
    free_beds_formula: "staffed_beds - total_occupied_beds"
    # ASSUMPTION: hospitals flexibly reassign ward capacity; no per-category bed pool exists.
    flexible_wards_no_isolated_capacity: true
  category_daily_generation:
    # ASSUMPTION: each section's discharges depend on its own current daily LOS.
    method: "admissions_discharges_turnover"
    formula: "occupied(t) = occupied(t-1) - occupied(t-1)/LOS(t) + admissions(t)"
    admissions_distribution: "poisson"
    admissions_rate: "monthly_target_census / LOS(t)"
    # ASSUMPTION: ICU has no LOS series; use the overall constant average LOS.
    icu_los_source: "vcu_average_los_days"
    total_occupied_beds_is_sum_of_sections: true
    exact_monthly_reconciliation: false
    known_tradeoff: "Volatile categories (influenza, COVID-19) show larger temporary drift from target after a monthly target shift, since the recurrence takes roughly one LOS-cycle to re-equilibrate."
    cross_section_capacity_feedback: false
  daily_length_of_stay:
    # ASSUMPTION: LOS varies day to day (AR(1), reusing total-census CV/persistence)
    # but is rescaled so each month's daily average equals the known monthly LOS.
    method: "ar1_rescaled_to_monthly_mean"
    minimum_days: 0.1
  master_daily_dataset:
    format: "wide"
    scope_start: "2017-01-01"
    scope_end: "2024-12-31"
    forecast_2025_2026_deferred: true

appointment_arrivals:
  seed: 2026
  # ASSUMPTION: No observed hourly pattern exists; all categories share a generic diurnal curve.
  profile: "sinusoidal_24_hour"
  peak_hour: 10
  # ASSUMPTION: Relative hourly intensity ranges from 0.3 to 1.7 around its daily mean.
  amplitude: 0.7
  preserve_daily_category_counts: true

maternal_newborn_couplet:
  enabled: true
  # ASSUMPTION: Each delivery admission represents one mother-newborn pair in the happy-path simulation.
  couplet_count_source: "delivery_admissions"
  arrival_time_source: "delivery_event"
  newborn_category_is_separate_arrival: false
  # ASSUMPTION: The pair shares one bed and one nurse assignment; the bed stays occupied until both are ready to leave.
  bed_capacity_units_per_couplet: 1
  nurse_assignments_per_couplet: 1
  room_occupancy_los_rule: "max(delivery_los_days, newborn_los_days)"

nurse_staffing:
  source_dataset: "data/vcu_master_daily.csv"
  output_dataset: "data/vcu_nurse_requirements_daily.csv"
  # Recommended nurse-to-patient ratios (patients per nurse), user-supplied reference list.
  # "max" = most patients per nurse (minimum staffing); "min" = fewest (maximum staffing).
  unit_ratios:
    icu: {patients_per_nurse_min: 1, patients_per_nurse_max: 2}
    med_surg: {patients_per_nurse_min: 4, patients_per_nurse_max: 5}
    labor_delivery: {patients_per_nurse_min: 1, patients_per_nurse_max: 2}
    pediatric: {patients_per_nurse_min: 3, patients_per_nurse_max: 4}
  # ED visit/triage census is absent; ED-originating inpatient admissions are distinct from ED visits.
  emergency_department_modeled: false
  category_to_unit:
    intensive: icu
    # ASSUMPTION: delivery census (incl. postpartum days) staffed at L&D active-labor ratio; overstates demand.
    delivery: labor_delivery
    # ASSUMPTION: newborns staffed at the pediatric ratio; no nursery ratio was supplied.
    newborn: pediatric
    # ASSUMPTION: inpatients admitted via ED are on med-surg floors after admission.
    non_elective_via_ed: med_surg
    non_elective_other: med_surg
    elective: med_surg
    covid_19: med_surg
    influenza: med_surg
    other_viral: med_surg
  # ASSUMPTION: two 12-hour shifts per day, each staffed to the daily (midnight) census.
  shifts_per_day: 2
  # Ratios applied per unit with ceiling rounding (a partial patient load still needs a nurse).
  rounding: "ceil_per_unit"
  # Pre-2020 COVID-19 census is missing (not applicable) and contributes zero nurses.
  missing_census_as_zero: true

room_cleaning:
  output_dataset: "data/vcu_cleaning_workload_daily.csv"
  # ASSUMPTION: times are user estimates informed by public summaries of the
  # Practice Guidance for Healthcare Environmental Cleaning, 4th Ed.; not quoted values.
  source: "Practice Guidance for Healthcare Environmental Cleaning, 4th Ed. (estimated)"
  source_verified: false
  # Mean minutes per clean. "occupied" = daily clean of an occupied room (bed state unchanged);
  # "discharge" = clean after discharge (duration of the `cleaning` bed state).
  unit_minutes:
    med_surg: {occupied: 30, discharge: 45}
    icu: {occupied: 40, discharge: 60}
    # ASSUMPTION: no L&D or pediatric values supplied; reuse med-surg times.
    labor_delivery: {occupied: 30, discharge: 45}
    pediatric: {occupied: 30, discharge: 45}
  # Reference only: no ED or OR room data exists in the dataset, so these are not used yet.
  unmodeled_room_minutes:
    emergency_room: {turnover: 15}
    operating_room: {turnover: 20, terminal: 60}
  # Reuses nurse_staffing.category_to_unit for category -> unit mapping.
  # ASSUMPTION: each occupied bed gets one occupied clean per day.
  occupied_cleans_per_bed_per_day: 1
  # ASSUMPTION: one discharge clean per expected discharge; transfers between units not counted.
  discharge_cleans_source: "expected_discharges"
  sampling:
    distribution: "lognormal"
    # ASSUMPTION: cleaning-time CV of 0.30; no variability data supplied.
    coefficient_of_variation: 0.30
    seed: 2026
  # Derived baseline mean: uniform 0-60 min wait from evs_staffing.baseline_rounds (60 / 2).
  needs_cleaning_wait_minutes: 30

hospital_layout:
  # ASSUMPTION: no VCU floor plan available; layout is synthetic but sums to the observed 905 staffed beds.
  total_beds_must_equal: 905
  floors:
    # ASSUMPTION: 30-bay ICU units; 4 floors (120 bays) cover the observed 2017-2024 ICU census max of 120.
    icu: {floor_count: 4, rooms_per_floor: 30}
    # ASSUMPTION: 40-room ward floors; one 25-room floor makes the total exactly 905.
    ward: {floor_count: 19, rooms_per_floor: 40}
    ward_partial: {floor_count: 1, rooms_per_floor: 25}
  # ASSUMPTION: each cleaner's assigned hall contains 10 rooms; the remaining rooms
  # on a floor form a partial hall.
  rooms_per_hall: 10
  # ASSUMPTION: ward categories (med-surg, delivery, newborn, viral) share ward floors flexibly.
  ward_floors_shared_by_categories: true
  patient_room_assignment:
    # ASSUMPTION: synthetic patients are randomly assigned to an eligible room;
    # the appointment category represents a care category, not a clinical diagnosis.
    method: "random_eligible_room"
    patient_id_source: "data/synthetic_appointments.csv:appointment_id"
    condition_category_source: "data/synthetic_appointments.csv:category"
    seed: 2026
  # Reference only: no ED visit data, so ED rooms are not simulated.
  emergency_department_rooms_reference: 80

simulation_pilot:
  # USER DECISION: initial pilot is limited to one floor and one cleaner.
  floor_count: 1
  cleaner_count: 1
  modeled_room_count: 10
  # ASSUMPTION: absent a selected unit type, this is a synthetic hospital-mix
  # hall, not a claim about a real VCU floor's category composition.
  floor_type: "synthetic_hospital_mix"
  patient_arrival_source: "data/synthetic_appointments.csv"
  initial_occupancy_source: "data/vcu_master_daily.csv"
  date: "2017-01-02"
  # ASSUMPTION: initialize occupied rooms by rounding the hospital-wide
  # occupied/staffed-bed fraction to the nearest whole pilot room.
  initial_occupancy_method: "round(total_occupied_beds / total_staffed_beds * modeled_room_count)"
  # ASSUMPTION: the pilot has no patient-level roster, so assign initial
  # occupant categories in proportion to observed daily category census.
  initial_patient_category_method: "sample_proportional_to_daily_category_occupancy"
  # ASSUMPTION: represent patients already in beds using a stationary residual
  # stay: length-biased total LOS, then a uniformly sampled elapsed fraction.
  initial_patient_remaining_los_method: "length_biased_lognormal_then_uniform_elapsed"
  # ASSUMPTION: thin hospital-wide appointments at 10 pilot rooms / 905 staffed
  # beds; resulting arrivals are a scaled synthetic sample, not floor-specific data.
  arrival_sampling_method: "bernoulli_thinning"
  arrival_sampling_probability: 0.011049724
  # ASSUMPTION: patients start their LOS clock when admitted to a room, after
  # any bed queue wait.
  length_of_stay_starts_at_admission: true
  # ASSUMPTION: when multiple usable rooms exist, assign the first by room ID.
  room_assignment_order: "room_id_ascending"
  # ASSUMPTION: ties among arrivals at the same timestamp use synthetic ID order.
  arrival_sort_keys: ["date", "check_in_time", "appointment_id"]
  patient_length_of_stay:
    distribution: "lognormal"
    # ASSUMPTION: no patient-level LOS distribution or CV is available; 0.50
    # is a provisional right-skewed spread, to be sensitivity-tested.
    coefficient_of_variation: 0.50
    sensitivity_coefficients_of_variation: [0.30, 0.50, 1.00]
    mean_source: "date-specific category avg_los_days in data/vcu_master_daily.csv"
    intensive_mean_source: "bed_type_estimation.patient_flow.derived_average_los_days"
    # ASSUMPTION: prevent zero or near-zero stays from producing unstable same-time event chains.
    minimum_days: 0.1
  seeds:
    # ASSUMPTION: separate fixed seeds make each stochastic input reproducible
    # and prevent changes in one draw sequence from shifting the others.
    room_occupancy: 2026
    initial_patient_categories: 2027
    initial_patient_remaining_los: 2028
    arrival_sampling: 2029
    arrival_patient_los: 2030
    initial_room_dirty_state: 2031
    cleaning_durations: 2032
  simulation_engine: "simpy"
  # ASSUMPTION: follow seven consecutive calendar days from the selected start
  # date, including all seven day shifts and overnight room waits.
  simulation_horizon_hours: 168
  cleaner_shift:
    # ASSUMPTION: the single pilot cleaner represents the existing day shift.
    shift_name: "day"
    start_hour: 7
    hours: 8
    productive_hours: 6
    # ASSUMPTION: the six productive hours are modeled consecutively from 7 AM;
    # the two nonproductive hours are not assigned separate break periods.
    productive_start_hour: 7
    # ASSUMPTION: an active clean that starts before productive hours end is completed,
    # even if that requires a small amount of overtime.
    finish_active_clean_after_shift: true
  # ASSUMPTION: patients in the ED-originating non-elective category receive
  # emergency queue priority; elective patients follow; all other categories
  # have the lowest priority because synthetic appointments have no triage field.
  patient_queue_priority:
    emergency_categories: ["non_elective_via_ed"]
    elective_categories: ["elective"]
    order: ["emergency", "elective", "other"]
    # ASSUMPTION: patients with the same priority are admitted FIFO.
    tie_breaker: "arrival_order"
  # ASSUMPTION: no nurse-ready or checkout delay data exists; the pilot performs
  # current_care and check_out at the generated end of stay.
  discharge_processing_delay_minutes: 0
  # ASSUMPTION: every discharged patient's room enters the cleaning cycle;
  # the 50% dirty probability applies only to initially unoccupied rooms.
  # ASSUMPTION: an initial dirty synthetic-mix room uses the med-surg discharge
  # clean estimate because it has no recorded prior patient category.
  default_cleaning_unit_for_unassigned_room: "med_surg"
  # These source choices affect the results produced by each seed. Changing a
  # seed or its listed inputs changes that stream; cleaning-duration means do
  # not affect patient/room random draws.
  seed_dependencies:
    room_occupancy: ["date", "modeled_room_count", "initial_occupancy_method"]
    initial_patient_categories: ["date", "initial_patient_category_method", "daily category occupancy", "room_assignment_order"]
    initial_patient_remaining_los: ["patient_length_of_stay.distribution", "coefficient_of_variation", "initial_patient_remaining_los_method", "category LOS means"]
    arrival_sampling: ["date", "arrival_sampling_probability", "patient_arrival_source", "arrival_sort_keys", "appointment_arrivals.seed"]
    arrival_patient_los: ["patient_length_of_stay.distribution", "coefficient_of_variation", "minimum_days", "selected appointment categories and category LOS means"]
    initial_room_dirty_state: ["date", "modeled_room_count", "probability_unoccupied_room_needs_cleaning", "room_assignment_order"]
    cleaning_durations: ["room_cleaning.sampling.distribution", "room_cleaning.sampling.coefficient_of_variation", "room_cleaning.unit_minutes", "default_cleaning_unit_for_unassigned_room", "evs_staffing.baseline_rounds.room_visit_order"]

evs_staffing:
  # ASSUMPTION: three 8-hour EVS shifts; no VCU EVS roster available.
  shifts:
    day: {start_hour: 7, hours: 8}
    evening: {start_hour: 15, hours: 8}
    night: {start_hour: 23, hours: 8}
  # ASSUMPTION: 6 of 8 shift hours are hands-on cleaning; the rest is travel, supplies, breaks.
  productive_hours_per_shift: 6
  # ASSUMPTION: cleaners per floor per shift; 2017-2024 daily utilization is ward 68% mean / 81% max,
  # ICU 65% mean / 92% max (see data/vcu_cleaning_workload_daily.csv).
  cleaners_per_floor:
    icu: {day: 3, evening: 1, night: 0.5}
    ward: {day: 3, evening: 1, night: 0.5}
    ward_partial: {day: 2, evening: 1, night: 0.5}
  # 0.5 = one night cleaner shared by two floors.
  baseline_rounds:
    # ASSUMPTION: in the baseline, a cleaner learns of a discharged room only when their round
    # passes it; one pass per room per hour gives a uniform 0-60 min `needs_cleaning` wait.
    round_interval_minutes: 60
    wait_distribution: "uniform"
    # ASSUMPTION: without a floor plan, visit rooms in ascending synthetic room ID.
    room_visit_order: "room_id_ascending"
    room_need_sampling:
      # ASSUMPTION: only unoccupied rooms are eligible to be checked/cleaned;
      # occupancy does not tell whether an eligible room is actually dirty.
      method: "sample_persistent_room_dirty_state"
      sample_when: ["simulation_initialization"]
      state_persists_until_cleaning: true
      # ASSUMPTION: use the user-selected 50% for now; no room-level observations exist.
      probability_unoccupied_room_needs_cleaning: 0.50
      seed: "simulation_pilot.seeds.initial_room_dirty_state"
  cleaner_assignment:
    # ASSUMPTION: each cleaner stays in one assigned 10-room hall; finishing early
    # does not result in a move to another hall or floor.
    remains_in_assigned_hall: true
    changes_floor_after_round: false
    # ASSUMPTION: a quick check of an already-clean room costs 2 minutes,
    # including the brief inspection and moving on; no local time study exists.
    unnecessary_check_duration_minutes: 2
    # ASSUMPTION: test sensitivity to the unmeasured wasted-check duration.
    unnecessary_check_sensitivity_minutes: [1, 2, 5]
  intervention:
    # Alert sent when the bed enters `discharge_pending`; cleaning starts at departure if a cleaner is free.
    notify_on_state: "discharge_pending"
    # ASSUMPTION: dispatch order is rooms with a waiting patient first (emergency before elective), then oldest discharge.
    dispatch_priority: ["waiting_emergency", "waiting_elective", "oldest_discharge"]